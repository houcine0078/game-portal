<div class="min-h-screen w-full bg-[#111827] flex items-center justify-center p-6 font-sans">
  
  <div class="animate-smooth-fade flex flex-col lg:flex-row w-full max-w-6xl h-[700px] rounded-2xl overflow-hidden shadow-[0_0_50px_rgba(0,0,0,0.6)] border border-gray-800">
    
    <div class="hidden lg:flex flex-col w-[60%] bg-cover bg-center relative justify-center items-center text-center p-12" 
         style="background-image: url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=2071&auto=format&fit=crop');">
      
      <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/50 to-black/30"></div>
      
      <div class="relative z-10 flex flex-col items-center">
        <h1 class="text-5xl font-bold text-white mb-3 tracking-widest uppercase drop-shadow-lg">Game Portal</h1>
        <p class="text-xl text-gray-300 mb-10 uppercase tracking-widest">Most Games In Here</p>
        
        <button type="button" (click)="toggleDescription()" 
                class="px-12 py-3.5 border-2 border-[#53a6eb] bg-[#53a6eb]/20 backdrop-blur-sm text-white rounded-full font-bold transition-all duration-300 hover:bg-[#53a6eb] hover:scale-105 hover:shadow-[0_0_25px_rgba(83,166,235,0.7)] active:scale-95 mb-6">
          VIEW MORE
        </button>

        <div *ngIf="showDescription" 
             class="w-full max-w-lg p-6 bg-black/70 rounded-xl backdrop-blur-md text-base text-gray-200 text-left border border-white/10 shadow-2xl animate-fade-in-up">
          <p>Welcome to the ultimate web gaming portal! , this platform lets you discover, play, and track your high scores across a massive catalog of  mini-games.</p>
        </div>
      </div>
    </div>

    <div class="w-full lg:w-[40%] h-full flex flex-col justify-center items-center bg-gradient-to-b from-[#53a6eb] to-[#1e5896] p-12 relative">
      
      <h2 class="text-3xl text-white font-medium mb-12 tracking-wide">Sign in to the site</h2>

      <form (ngSubmit)="onSubmit()" class="w-full space-y-6">
        <div>
          <input type="text" [(ngModel)]="username" name="username" placeholder="Username"
                 class="w-full px-6 py-4 rounded-full bg-black/10 border-2 border-white/50 text-white placeholder-white/70 focus:outline-none focus:border-white focus:bg-white/20 transition-all duration-300">
        </div>

        <div>
          <input type="password" [(ngModel)]="password" name="password" placeholder="Password"
                 class="w-full px-6 py-4 rounded-full bg-black/10 border-2 border-white/50 text-white placeholder-white/70 focus:outline-none focus:border-white focus:bg-white/20 transition-all duration-300">
        </div>

        <button type="submit" 
                class="w-full mt-8 bg-white text-[#1e5896] font-extrabold py-4 px-4 rounded-full transition-all duration-300 hover:bg-gray-100 hover:scale-[1.02] hover:shadow-[0_10px_20px_rgba(0,0,0,0.3)] active:scale-95 uppercase tracking-widest">
          LOGIN
        </button>
      </form>

      <p *ngIf="message" class="mt-6 font-bold tracking-wide" 
         [ngClass]="{'text-green-300': message.includes('Success'), 'text-red-300': message.includes('Error')}">
        {{ message }}
      </p>

      <div class="absolute bottom-8 text-center w-full">
        <p class="text-white/80 text-base">New player? 
          <a routerLink="/register" class="text-white font-bold hover:underline hover:text-blue-200 transition-colors">Create Account</a>
        </p>
      </div>
      
    </div>
  </div>
</div>
