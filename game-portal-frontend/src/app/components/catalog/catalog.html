<div class="min-h-screen bg-[#0f172a] p-8 font-sans text-white">
  
  <div class="max-w-7xl mx-auto mb-12 flex justify-between items-center border-b border-gray-800 pb-6">
    <h1 class="text-4xl font-bold tracking-widest uppercase text-transparent bg-clip-text bg-gradient-to-r from-[#53a6eb] to-purple-400">
      Arcade Catalog
    </h1>
    <div class="h-10 w-10 rounded-full bg-gray-700 border-2 border-[#53a6eb] flex items-center justify-center cursor-pointer hover:bg-gray-600 transition">
      <span class="text-sm font-bold">P1</span>
    </div>
  </div>

  <div class="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
    
    <div *ngFor="let game of games" 
         class="group bg-gray-900 rounded-2xl overflow-hidden border border-gray-800 shadow-lg hover:shadow-[0_0_25px_rgba(83,166,235,0.3)] transition-all duration-300 hover:-translate-y-2 cursor-pointer">
      
      <div class="h-48 w-full overflow-hidden relative">
        <img [src]="game.thumbnailUrl" alt="{{ game.title }}" 
             class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
        <span class="absolute top-3 right-3 bg-black/70 backdrop-blur-sm text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider text-[#53a6eb] border border-[#53a6eb]/50">
          {{ game.category }}
        </span>
      </div>

      <div class="p-5">
        <h3 class="text-xl font-bold mb-2 tracking-wide">{{ game.title }}</h3>
        <p class="text-gray-400 text-sm mb-6 line-clamp-2">{{ game.description }}</p>
        
        <button class="w-full py-2.5 bg-gray-800 hover:bg-[#53a6eb] text-white font-bold rounded-lg transition-colors duration-300 tracking-widest text-sm uppercase">
          Play Now
        </button>
      </div>

    </div>

  </div>
  
  <div *ngIf="games.length === 0" class="text-center mt-20 text-gray-500">
    <p class="text-xl">No games found in the database. Insert a coin!</p>
  </div>

</div>
