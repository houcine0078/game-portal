<div class="min-h-screen bg-[#0f172a] text-white flex flex-col items-center py-12 font-sans">
    <div class="w-full max-w-2xl flex justify-start mb-4 px-4">
    <button routerLink="/catalog" class="px-4 py-2 bg-gray-800 border border-gray-700 hover:bg-red-600 hover:border-red-500 text-gray-300 hover:text-white font-bold rounded-lg transition-all duration-300 flex items-center gap-2 text-sm tracking-wider uppercase shadow-lg cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
      </svg>
      Exit Arcade
    </button>
  </div>
  
  <div class="w-full max-w-2xl flex justify-between items-center mb-8 px-4">
    <h1 class="text-3xl font-bold tracking-widest uppercase text-[#53a6eb]">Memory Match</h1>
    <div class="flex gap-6 text-lg tracking-wide font-medium">
      <p>Moves: <span class="text-purple-400">{{ moves }}</span></p>
      <p>Matches: <span class="text-green-400">{{ matchesFound }} / 8</span></p>
    </div>
  </div>

  <div *ngIf="matchesFound === 8" class="mb-8 p-6 bg-green-500/20 border border-green-500 rounded-xl text-center animate-fade-in-up">
    <h2 class="text-2xl font-bold text-green-400 mb-2">You Won!</h2>
    <p class="text-gray-300">Completed in {{ moves }} moves.</p>
  </div>

  <div class="grid grid-cols-4 gap-4 md:gap-6 bg-gray-900 p-6 md:p-8 rounded-2xl border border-gray-800 shadow-[0_0_40px_rgba(0,0,0,0.5)]">
    
    <div *ngFor="let card of cards" class="perspective-1000 w-20 h-24 md:w-28 md:h-36 cursor-pointer" (click)="flipCard(card)">
      
      <div class="relative w-full h-full transition-transform duration-500 transform-style-3d"
           [ngClass]="{'rotate-y-180': card.isFlipped || card.isMatched}">
        
        <div class="absolute w-full h-full backface-hidden bg-gradient-to-br from-[#1e5896] to-[#53a6eb] rounded-xl border-2 border-white/20 shadow-lg flex items-center justify-center hover:shadow-[0_0_15px_rgba(83,166,235,0.6)] transition-shadow">
          <span class="text-3xl opacity-50">🕹️</span>
        </div>

        <div class="absolute w-full h-full backface-hidden rotate-y-180 bg-gray-800 rounded-xl border-2 border-gray-600 shadow-lg flex items-center justify-center text-4xl md:text-5xl"
             [ngClass]="{'border-green-400 bg-green-900/30': card.isMatched}">
          {{ card.icon }}
        </div>

      </div>
    </div>
  </div>

  <button (click)="setupGame()" 
          class="mt-12 px-10 py-3 bg-transparent border-2 border-purple-500 text-purple-400 font-bold rounded-full hover:bg-purple-500 hover:text-white transition duration-300 tracking-widest uppercase">
    Restart Game
  </button>

</div>
