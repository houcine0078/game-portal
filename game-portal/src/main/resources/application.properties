# =============================================================================
# CONFIGURATION APPLICATION - Game Portal
# =============================================================================
# SANS SPRING : ces valeurs seraient lues manuellement via
#   Properties props = new Properties();
#   props.load(new FileInputStream("app.properties"));
#   String url = props.getProperty("db.url");
# AVEC SPRING : injection automatique via @Value ou @ConfigurationProperties,
#   plus validation, rechargement, profils (dev/prod) inclus
# =============================================================================

# --- Serveur ---
server.port=8080

# --- Base de données MySQL ---
# SANS SPRING : DriverManager.getConnection(url, user, pass) répété dans chaque DAO,
#   sans pool de connexions → risque de connexions non fermées
# AVEC SPRING : DataSource unique avec pool HikariCP, fermé proprement au shutdown
spring.datasource.url=jdbc:mysql://localhost:3306/game_portal?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=172005houcine
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Hibernate / JPA ---
# SANS SPRING JPA : persistence.xml + EntityManagerFactory/EntityManager manuels
# AVEC SPRING : auto-configuration, gestion des transactions (@Transactional)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- JWT ---
# Clé secrète pour signer les tokens (HS256 — 256 bits min.)
# SANS SPRING SECURITY : constante codée en dur ou fichier .properties lu manuellement
# AVEC SPRING : injectée via @Value, peut être externalisée (Vault, env var)
jwt.secret=game-portal-jwt-secret-key-must-be-at-least-32-bytes-long-for-security
jwt.expiration=86400000

# --- Logs ---
logging.level.com.example.game_portal=DEBUG
logging.level.org.springframework.security=INFO